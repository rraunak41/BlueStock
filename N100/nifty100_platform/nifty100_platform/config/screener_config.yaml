# Nifty 100 Financial Intelligence Platform — Screener Configuration
# Analysts edit this file to create/modify screens. No code changes needed.

presets:
  quality_compounder:
    name: "Quality Compounder"
    filters:
      return_on_equity_pct: {min: 15}
      debt_to_equity: {max: 1.0}
      free_cash_flow_cr: {min: 0}
      revenue_cagr_5yr_pct: {min: 10}
    rank_by: composite_quality_score
    rank_desc: true

  value_pick:
    name: "Value Pick"
    filters:
      pe_ratio: {max: 20}
      pb_ratio: {max: 3.0}
      debt_to_equity: {max: 2.0}
      dividend_yield_pct: {min: 1}
    rank_by: fcf_yield_pct
    rank_desc: true

  growth_accelerator:
    name: "Growth Accelerator"
    filters:
      pat_cagr_5yr_pct: {min: 20}
      revenue_cagr_5yr_pct: {min: 15}
      debt_to_equity: {max: 2.0}
    rank_by: pat_cagr_5yr_pct
    rank_desc: true

  dividend_champion:
    name: "Dividend Champion"
    filters:
      dividend_yield_pct: {min: 2}
      dividend_payout: {max: 80}
      free_cash_flow_cr: {min: 0}
    rank_by: dividend_yield_pct
    rank_desc: true

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    filters:
      debt_to_equity: {max: 0.01}
      return_on_equity_pct: {min: 12}
      sales: {min: 5000}
    rank_by: return_on_equity_pct
    rank_desc: true

  turnaround_watch:
    name: "Turnaround Watch"
    filters:
      revenue_cagr_3yr_pct: {min: 10}
    rank_by: revenue_cagr_3yr_pct
    rank_desc: true

# Composite score weights (used by ranking engine, Module 3.3)
composite_score_weights:
  profitability: 0.35   # ROE 15%, ROCE 10%, NPM 10%
  cash_quality: 0.30    # FCF CAGR 15%, CFO/PAT 10%, FCF>0 flag 5%
  growth: 0.20          # Revenue CAGR 5yr 10%, PAT CAGR 5yr 10%
  leverage: 0.15        # D/E score 10%, ICR score 5%
